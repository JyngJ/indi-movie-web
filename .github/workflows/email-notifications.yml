name: Email notifications
on:
  schedule:
    # 한국 시간 월·금 09:13. 거절된 요청의 재시도는 10:13·11:13에 실행한다.
    # 정각(:00)을 피한다 — GitHub 예약은 정각에 몰려 늦거나 빠진다. 2026-10-23 첫 발송일에
    # 09:00·10:00 예약이 둘 다 돌지 않아 수동으로 보냈다. 발송 창(scheduleSlot, 09:00~11:59 KST)
    # 밖으로 당기면 아무것도 보내지 않으므로 창 안쪽 분으로만 옮긴다.
    - cron: '13 0,1,2 * * 1,5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: email-notifications
  cancel-in-progress: false
jobs:
  send:
    if: vars.EMAIL_NOTIFICATION_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/notify-email.ts --send
        env:
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          EMAIL_NOTIFICATION_DELIVERY_ENABLED: 'true'
          EMAIL_ANALYTICS_ENABLED: 'true'
          NEXT_PUBLIC_POSTHOG_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_NOTIFICATION_TOKEN_SECRET: ${{ secrets.EMAIL_NOTIFICATION_TOKEN_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      # 통계가 실패해도 메일 발송을 재실행하지 않는다. 다음 실행에서 발송 기록만 재동기화한다.
      - run: npx tsx scripts/sync-email-analytics.ts --send
        if: always()
        env:
          EMAIL_ANALYTICS_ENABLED: 'true'
          NEXT_PUBLIC_POSTHOG_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_NOTIFICATION_TOKEN_SECRET: ${{ secrets.EMAIL_NOTIFICATION_TOKEN_SECRET }}
