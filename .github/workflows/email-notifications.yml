name: Email notifications
on:
  schedule:
    # 한국 시간 월·금 09:13부터 21:13까지 매시. 주 실행은 라즈베리파이 cron이 09:13에
    # workflow_dispatch로 건다(docs/RUNBOOK-email-notifications.md) — 이 예약은 예비다.
    # GitHub 예약은 몇 시간씩 늦거나 빠진다: 2026-10-23 09:00 예약이 16:25에 돌았고,
    # 10-26엔 09:13·10:13·11:13 예약이 12시 전에 하나도 오지 않았다. 같은 날짜는 한 슬롯이라
    # 여러 번 돌아도 이미 보낸 사람에겐 다시 보내지 않는다. 발송 창은 scheduleSlot(09:00~21:59 KST).
    - cron: '13 0-12 * * 1,5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: email-notifications
  cancel-in-progress: false
jobs:
  send:
    if: vars.EMAIL_NOTIFICATION_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/notify-email.ts --send
        env:
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          EMAIL_NOTIFICATION_DELIVERY_ENABLED: 'true'
          EMAIL_ANALYTICS_ENABLED: 'true'
          NEXT_PUBLIC_POSTHOG_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_NOTIFICATION_TOKEN_SECRET: ${{ secrets.EMAIL_NOTIFICATION_TOKEN_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      # 통계가 실패해도 메일 발송을 재실행하지 않는다. 다음 실행에서 발송 기록만 재동기화한다.
      - run: npx tsx scripts/sync-email-analytics.ts --send
        if: always()
        env:
          EMAIL_ANALYTICS_ENABLED: 'true'
          NEXT_PUBLIC_POSTHOG_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_NOTIFICATION_TOKEN_SECRET: ${{ secrets.EMAIL_NOTIFICATION_TOKEN_SECRET }}
